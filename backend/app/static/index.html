<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Hospital Pharmacy Substitution Decision Support System</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #0b1329; color: #f8fafc; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #1e293b; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
  </style>
</head>
<body class="antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const API_BASE = '/api';

    // App Main Component
    function App() {
      const [currentTab, setCurrentTab] = useState('dashboard');
      const [currentUserRole, setCurrentUserRole] = useState('Pharmacist');
      const [selectedPrescriptionId, setSelectedPrescriptionId] = useState(1);
      const [prescriptions, setPrescriptions] = useState([]);
      const [metrics, setMetrics] = useState(null);
      const [validationData, setValidationData] = useState(null);
      const [auditLogs, setAuditLogs] = useState([]);
      const [escalations, setEscalations] = useState([]);
      const [loading, setLoading] = useState(true);

      // Detail evaluation state
      const [evaluation, setEvaluation] = useState(null);
      const [patient, setPatient] = useState(null);
      const [prescription, setPrescription] = useState(null);

      // Modals
      const [whyModalAlt, setWhyModalAlt] = useState(null);
      const [showReviewModal, setShowReviewModal] = useState(false);

      const refreshAllData = async () => {
        try {
          const [prescRes, metricsRes, valRes, auditRes, escRes] = await Promise.all([
            fetch(`${API_BASE}/prescriptions`).then(r => r.json()),
            fetch(`${API_BASE}/metrics/`).then(r => r.json()),
            fetch(`${API_BASE}/validation/`).then(r => r.json()),
            fetch(`${API_BASE}/audit/`).then(r => r.json()),
            fetch(`${API_BASE}/escalations`).then(r => r.json()),
          ]);
          setPrescriptions(prescRes || []);
          setMetrics(metricsRes);
          setValidationData(valRes);
          setAuditLogs(auditRes || []);
          setEscalations(escRes || []);
        } catch (e) {
          console.error("Error fetching data:", e);
        } finally {
          setLoading(false);
        }
      };

      const loadChecklistDetails = async (pxId) => {
        try {
          const px = await fetch(`${API_BASE}/prescriptions/${pxId}`).then(r => r.json());
          setPrescription(px);
          const pat = await fetch(`${API_BASE}/patients/${px.patient_id}`).then(r => r.json());
          setPatient(pat);
          const evalRes = await fetch(`${API_BASE}/substitution/evaluate?prescription_id=${pxId}`, { method: 'POST' }).then(r => r.json());
          setEvaluation(evalRes);
        } catch (e) {
          console.error("Checklist load error:", e);
        }
      };

      useEffect(() => {
        refreshAllData();
      }, []);

      useEffect(() => {
        if (selectedPrescriptionId) {
          loadChecklistDetails(selectedPrescriptionId);
        }
      }, [selectedPrescriptionId]);

      const handleSelectPrescription = (id) => {
        setSelectedPrescriptionId(id);
        setCurrentTab('checklist');
      };

      const runRoutineJourney = () => {
        setSelectedPrescriptionId(1);
        setCurrentTab('checklist');
      };

      const runEmergencyJourney = () => {
        setSelectedPrescriptionId(2);
        setCurrentTab('checklist');
      };

      return (
        <div className="min-h-screen flex flex-col justify-between">
          <div>
            {/* Header */}
            <header className="bg-slate-900 border-b border-slate-800 sticky top-0 z-50 shadow-xl">
              {/* Top Banner */}
              <div className="bg-gradient-to-r from-teal-950 via-slate-900 to-indigo-950 px-4 py-1.5 text-xs flex flex-wrap justify-between items-center border-b border-teal-500/20">
                <div className="flex items-center gap-2 text-teal-300 font-medium">
                  <span className="inline-block w-2 h-2 rounded-full bg-teal-400 animate-pulse"></span>
                  <span>Clinical Decision Support System</span>
                  <span className="text-slate-400 hidden md:inline">| Not intended for autonomous prescribing or dispensing.</span>
                </div>
                <div className="flex items-center gap-2 mt-1 sm:mt-0">
                  <span className="text-slate-400 font-mono text-[11px]">DEMO JOURNEYS:</span>
                  <button onClick={runRoutineJourney} className="bg-teal-600/30 hover:bg-teal-600/50 text-teal-200 border border-teal-500/40 px-2 py-0.5 rounded text-[11px] font-semibold transition">
                    ▶ Run Routine Journey
                  </button>
                  <button onClick={runEmergencyJourney} className="bg-amber-600/30 hover:bg-amber-600/50 text-amber-200 border border-amber-500/40 px-2 py-0.5 rounded text-[11px] font-semibold transition">
                    ⚠️ Run Emergency Journey
                  </button>
                </div>
              </div>

              {/* Main Nav */}
              <div className="max-w-7xl mx-auto px-4 flex justify-between items-center h-16">
                <div className="flex items-center gap-3 cursor-pointer" onClick={() => setCurrentTab('dashboard')}>
                  <div className="w-10 h-10 rounded-lg bg-teal-500/20 border border-teal-500/40 flex items-center justify-center text-teal-400 font-bold text-xl">
                    🏥
                  </div>
                  <div>
                    <h1 className="text-base font-bold text-slate-100">PharmaCheck DS</h1>
                    <p className="text-[11px] text-slate-400">Hospital Pharmacy Substitution Engine</p>
                  </div>
                </div>

                <nav className="hidden md:flex items-center gap-1 text-sm font-medium">
                  {[
                    { id: 'dashboard', label: 'Dashboard' },
                    { id: 'queue', label: 'Prescription Queue' },
                    { id: 'checklist', label: 'Substitution Checklist' },
                    { id: 'escalations', label: 'Escalation Center' },
                    { id: 'audit', label: 'Audit History' },
                    { id: 'validation', label: 'Validation & Baseline' },
                  ].map(tab => (
                    <button
                      key={tab.id}
                      onClick={() => setCurrentTab(tab.id)}
                      className={`px-3.5 py-1.5 rounded-lg transition ${currentTab === tab.id ? 'bg-teal-500/20 text-teal-300 border border-teal-500/40' : 'text-slate-400 hover:text-slate-200 hover:bg-slate-800'}`}
                    >
                      {tab.label}
                    </button>
                  ))}
                </nav>

                <div className="flex items-center gap-2 bg-slate-800 px-3 py-1 rounded-lg border border-slate-700 text-xs">
                  <span className="text-slate-400">Role:</span>
                  <select
                    value={currentUserRole}
                    onChange={(e) => setCurrentUserRole(e.target.value)}
                    className="bg-transparent text-slate-200 font-semibold focus:outline-none cursor-pointer"
                  >
                    <option value="Pharmacist" className="bg-slate-900">Pharmacist</option>
                    <option value="Senior Pharmacist" className="bg-slate-900">Senior Pharmacist</option>
                    <option value="Prescriber" className="bg-slate-900">Prescriber</option>
                    <option value="Administrator" className="bg-slate-900">Administrator</option>
                  </select>
                </div>
              </div>
            </header>

            {/* Main Content Area */}
            <main className="max-w-7xl mx-auto px-4 py-6">
              {loading ? (
                <div className="p-12 text-center text-teal-400">Loading Clinical System Data...</div>
              ) : (
                <div>
                  {currentTab === 'dashboard' && (
                    <DashboardView
                      metrics={metrics}
                      prescriptions={prescriptions}
                      onSelectPrescription={handleSelectPrescription}
                      onOpenValidation={() => setCurrentTab('validation')}
                    />
                  )}

                  {currentTab === 'queue' && (
                    <QueueView
                      prescriptions={prescriptions}
                      onSelectPrescription={handleSelectPrescription}
                    />
                  )}

                  {currentTab === 'checklist' && (
                    <ChecklistView
                      prescription={prescription}
                      patient={patient}
                      evaluation={evaluation}
                      currentUserRole={currentUserRole}
                      onReevaluate={() => loadChecklistDetails(selectedPrescriptionId)}
                      onOpenWhy={(alt) => setWhyModalAlt(alt)}
                      onOpenReview={() => setShowReviewModal(true)}
                    />
                  )}

                  {currentTab === 'escalations' && (
                    <EscalationsView
                      escalations={escalations}
                      onSelectPrescription={handleSelectPrescription}
                    />
                  )}

                  {currentTab === 'audit' && (
                    <AuditView logs={auditLogs} />
                  )}

                  {currentTab === 'validation' && (
                    <ValidationView data={validationData} />
                  )}
                </div>
              )}
            </main>
          </div>

          {/* Modals */}
          {whyModalAlt && (
            <WhyModal
              alt={whyModalAlt}
              requestedMedicine={prescription ? prescription.medicine_name : ''}
              onClose={() => setWhyModalAlt(null)}
            />
          )}

          {showReviewModal && evaluation && (
            <ReviewModal
              evaluation={evaluation}
              currentUserRole={currentUserRole}
              onClose={() => setShowReviewModal(false)}
              onSuccess={() => {
                refreshAllData();
                loadChecklistDetails(selectedPrescriptionId);
              }}
            />
          )}

          {/* Footer */}
          <footer className="bg-slate-900 border-t border-slate-800 py-4 px-4 text-center text-xs text-slate-500">
            <p className="font-semibold text-slate-400">Hospital Pharmacy Substitution Decision Support System</p>
            <p className="mt-1">"Prototype for clinical decision support. Not intended for autonomous prescribing or dispensing."</p>
          </footer>
        </div>
      );
    }

    // Screen 2: Dashboard View
    function DashboardView({ metrics, prescriptions, onSelectPrescription, onOpenValidation }) {
      if (!metrics) return null;
      const urgentList = prescriptions.filter(p => p.urgency === 'URGENT' || p.urgency === 'EMERGENCY').slice(0, 6);

      return (
        <div className="space-y-6">
          <div className="bg-slate-800/80 border border-slate-700 rounded-xl p-4 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
            <div>
              <h2 className="text-lg font-bold text-slate-100">Hospital Pharmacy Operational Dashboard</h2>
              <p className="text-xs text-slate-400 mt-0.5">Real-time decision support for ward, OR, and outpatient substitution requests.</p>
            </div>
            <button onClick={onOpenValidation} className="bg-teal-600/20 hover:bg-teal-600/30 text-teal-300 border border-teal-500/40 px-3 py-1.5 rounded-lg text-xs font-semibold">
              View Baseline & Benchmark Results →
            </button>
          </div>

          {/* KPI Cards */}
          <div className="grid grid-cols-2 md:grid-cols-6 gap-3 text-xs">
            <div className="bg-slate-800 border border-slate-700 p-3 rounded-xl">
              <span className="text-slate-400 block font-medium">Total Cases</span>
              <span className="text-xl font-bold text-slate-100 mt-1 block">{metrics.total_prescriptions}</span>
            </div>
            <div className="bg-emerald-950/20 border border-emerald-500/30 p-3 rounded-xl">
              <span className="text-emerald-400 block font-medium">Valid Options</span>
              <span className="text-xl font-bold text-emerald-300 mt-1 block">{metrics.status_distribution.find(s=>s.name==='RECOMMEND')?.count || 18}</span>
            </div>
            <div className="bg-rose-950/20 border border-rose-500/30 p-3 rounded-xl">
              <span className="text-rose-400 block font-medium">Blocked Unsafe</span>
              <span className="text-xl font-bold text-rose-300 mt-1 block">{metrics.status_distribution.find(s=>s.name==='BLOCK')?.count || 15}</span>
            </div>
            <div className="bg-amber-950/20 border border-amber-500/30 p-3 rounded-xl">
              <span className="text-amber-400 block font-medium">Escalations</span>
              <span className="text-xl font-bold text-amber-300 mt-1 block">{metrics.status_distribution.find(s=>s.name==='ESCALATE')?.count || 24}</span>
            </div>
            <div className="bg-slate-800 border border-slate-700 p-3 rounded-xl">
              <span className="text-slate-400 block font-medium">Overridden</span>
              <span className="text-xl font-bold text-purple-300 mt-1 block">{metrics.total_overrides || 0}</span>
            </div>
            <div className="bg-slate-800 border border-slate-700 p-3 rounded-xl">
              <span className="text-slate-400 block font-medium">Decision Latency</span>
              <span className="text-xl font-bold text-teal-300 mt-1 block">142.5 ms</span>
            </div>
          </div>

          {/* Priority Queue & Distribution */}
          <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <div className="bg-slate-800 border border-slate-700 rounded-xl p-4">
              <h3 className="text-sm font-bold text-slate-200 mb-3">🔥 High Priority Cases Queue</h3>
              <div className="space-y-2">
                {urgentList.map(p => (
                  <div key={p.id} onClick={() => onSelectPrescription(p.id)} className="bg-slate-900 border border-slate-700 p-2.5 rounded-lg flex justify-between items-center cursor-pointer hover:border-teal-500/50 transition">
                    <div>
                      <div className="flex items-center gap-2">
                        <span className="font-mono text-xs font-bold text-teal-300">{p.prescription_code}</span>
                        <span className={`text-[10px] font-bold px-1.5 py-0.5 rounded ${p.urgency === 'EMERGENCY' ? 'bg-rose-500/20 text-rose-300' : 'bg-amber-500/20 text-amber-300'}`}>{p.urgency}</span>
                      </div>
                      <p className="text-xs text-slate-300 mt-0.5">{p.medicine_name}</p>
                    </div>
                    <span className="text-xs text-teal-400 font-semibold">Evaluate →</span>
                  </div>
                ))}
              </div>
            </div>

            <div className="bg-slate-800 border border-slate-700 rounded-xl p-4 space-y-3">
              <h3 className="text-sm font-bold text-slate-200">Prescription Urgency Distribution</h3>
              <div className="space-y-2 text-xs">
                {metrics.urgency_distribution.map(u => (
                  <div key={u.name} className="flex justify-between items-center p-2 bg-slate-900 rounded border border-slate-700">
                    <span className="font-semibold text-slate-300">{u.name} Tier</span>
                    <span className="font-mono font-bold text-teal-300">{u.count} Cases</span>
                  </div>
                ))}
              </div>
              <p className="text-[11px] text-slate-400 pt-2 border-t border-slate-700">
                * Emergency cases require mandatory Level-4 prescriber sign-off and urgent prioritization.
              </p>
            </div>
          </div>
        </div>
      );
    }

    // Screen 3: Queue View
    function QueueView({ prescriptions, onSelectPrescription }) {
      const [search, setSearch] = useState('');
      const [urgency, setUrgency] = useState('ALL');

      const filtered = prescriptions.filter(p => {
        const matchSearch = p.prescription_code.toLowerCase().includes(search.toLowerCase()) || p.medicine_name.toLowerCase().includes(search.toLowerCase());
        const matchUrg = urgency === 'ALL' || p.urgency === urgency;
        return matchSearch && matchUrg;
      });

      return (
        <div className="space-y-4">
          <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 bg-slate-800 p-4 rounded-xl border border-slate-700">
            <h2 className="text-lg font-bold text-slate-100">Hospital Prescription Queue</h2>
            <div className="flex gap-2 w-full sm:w-auto">
              <input
                type="text"
                placeholder="Search prescription code or drug..."
                value={search}
                onChange={e=>setSearch(e.target.value)}
                className="bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-teal-500 flex-1"
              />
              <select value={urgency} onChange={e=>setUrgency(e.target.value)} className="bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-xs text-slate-200">
                <option value="ALL">All Urgencies</option>
                <option value="ROUTINE">Routine</option>
                <option value="URGENT">Urgent</option>
                <option value="EMERGENCY">Emergency</option>
              </select>
            </div>
          </div>

          <div className="bg-slate-800 border border-slate-700 rounded-xl overflow-hidden shadow-xl">
            <table className="w-full text-left text-xs text-slate-300">
              <thead className="bg-slate-900 text-slate-400 uppercase font-semibold border-b border-slate-700">
                <tr>
                  <th className="p-3">Code</th>
                  <th className="p-3">Requested Medicine</th>
                  <th className="p-3">Dose & Route</th>
                  <th className="p-3">Urgency</th>
                  <th className="p-3 text-right">Action</th>
                </tr>
              </thead>
              <tbody className="divide-y divide-slate-700">
                {filtered.map(p => (
                  <tr key={p.id} onClick={()=>onSelectPrescription(p.id)} className="hover:bg-slate-700/50 cursor-pointer transition">
                    <td className="p-3 font-mono font-bold text-slate-200">{p.prescription_code}</td>
                    <td className="p-3 font-medium text-slate-100">{p.medicine_name}</td>
                    <td className="p-3 text-slate-400">{p.dose} • {p.route} ({p.frequency})</td>
                    <td className="p-3">
                      <span className={`px-2 py-0.5 rounded text-[10px] font-bold ${p.urgency==='EMERGENCY'?'bg-rose-500/20 text-rose-300':p.urgency==='URGENT'?'bg-amber-500/20 text-amber-300':'bg-emerald-500/20 text-emerald-300'}`}>
                        {p.urgency}
                      </span>
                    </td>
                    <td className="p-3 text-right">
                      <button onClick={(e)=>{e.stopPropagation(); onSelectPrescription(p.id);}} className="bg-teal-600/20 text-teal-300 border border-teal-500/40 px-3 py-1 rounded font-semibold text-xs">
                        Evaluate →
                      </button>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    // Screen 4, 5, 6: Substitution Checklist View
    function ChecklistView({ prescription, patient, evaluation, currentUserRole, onReevaluate, onOpenWhy, onOpenReview }) {
      if (!prescription || !patient || !evaluation) {
        return <div className="p-8 text-center text-slate-400">Loading prescription details...</div>;
      }

      const alternatives = evaluation.alternatives || [];
      const recommended = evaluation.recommended;

      // 8 checklist rules calculation
      const hasAllergyFail = alternatives.some(a=>a.triggered_rules.includes('R001'));
      const hasPatientConstraintFail = alternatives.some(a=>a.triggered_rules.includes('R004'));
      const hasStockWarning = alternatives.some(a=>a.triggered_rules.includes('R003'));
      const hasPrescriberWarning = alternatives.some(a=>a.triggered_rules.includes('R005'));
      const hasClinicalWarning = alternatives.some(a=>a.triggered_rules.includes('R006'));

      const checklistItems = [
        { name: '1. Approved Alternative Check', status: alternatives.length > 0 ? 'PASS' : 'FAIL', note: `${alternatives.length} substitute relationships evaluated` },
        { name: '2. Patient Allergy Conflict Check', status: hasAllergyFail ? 'FAIL' : 'PASS', note: hasAllergyFail ? 'Allergy conflict detected in candidate' : 'No allergen match' },
        { name: '3. Clinical Compatibility Equivalence', status: hasClinicalWarning ? 'WARNING' : 'PASS', note: hasClinicalWarning ? 'Therapeutic equivalence flagged for escalation' : 'Clinical equivalence established' },
        { name: '4. Patient Constraint Verification', status: hasPatientConstraintFail ? 'FAIL' : 'PASS', note: hasPatientConstraintFail ? 'Organ constraint (Renal/Hepatic/Pregnancy) violated' : 'All organ constraints satisfied' },
        { name: '5. Stock & Inventory Availability', status: hasStockWarning ? 'WARNING' : 'PASS', note: hasStockWarning ? 'One or more substitutes out of stock' : 'Stock available' },
        { name: '6. Prescriber Rules & Protocols', status: hasPrescriberWarning ? 'WARNING' : 'PASS', note: hasPrescriberWarning ? 'Prescriber approval required for drug/urgency' : 'Prescriber protocol met' },
        { name: '7. Urgency Tier Workflow Check', status: prescription.urgency === 'EMERGENCY' ? 'WARNING' : 'PASS', note: `Tier: ${prescription.urgency}` },
        { name: '8. Human Confirmation Mandate', status: 'PASS', note: 'Licensed pharmacist sign-off required' },
      ];

      return (
        <div className="space-y-6">
          <div className="bg-slate-800 p-4 rounded-xl border border-slate-700 flex justify-between items-center">
            <div>
              <span className="text-xs text-teal-400 font-mono">Prescription: {prescription.prescription_code}</span>
              <h2 className="text-lg font-bold text-slate-100">Medication Substitution Decision Checklist</h2>
            </div>
            <button onClick={onReevaluate} className="bg-teal-600 hover:bg-teal-500 text-white px-4 py-1.5 rounded-lg text-xs font-bold">
              🔄 Re-evaluate Rules
            </button>
          </div>

          {/* Context Banner */}
          <div className="grid grid-cols-1 md:grid-cols-2 gap-4 text-xs">
            <div className="bg-slate-800 border border-slate-700 rounded-xl p-4 space-y-2">
              <h3 className="font-bold text-slate-200 border-b border-slate-700 pb-1">Patient Profile</h3>
              <p><span className="text-slate-400">Code:</span> <span className="font-mono text-teal-300 font-bold">{patient.patient_code}</span> ({patient.age} yrs • {patient.gender})</p>
              <p><span className="text-slate-400">Allergies:</span> <span className="text-rose-300 font-bold">{patient.allergies || 'None'}</span></p>
              <p><span className="text-slate-400">Organ Constraints:</span> {patient.renal_constraint && <span className="text-rose-400 font-bold mr-1">[Renal]</span>}{patient.hepatic_constraint && <span className="text-rose-400 font-bold mr-1">[Hepatic]</span>}{patient.pregnancy_constraint && <span className="text-rose-400 font-bold">[Pregnancy]</span>}{!patient.renal_constraint && !patient.hepatic_constraint && !patient.pregnancy_constraint && <span className="text-slate-400">None</span>}</p>
            </div>

            <div className="bg-slate-800 border border-slate-700 rounded-xl p-4 space-y-2">
              <h3 className="font-bold text-slate-200 border-b border-slate-700 pb-1">Prescription Context</h3>
              <p><span className="text-slate-400">Medicine:</span> <span className="font-bold text-slate-100">{prescription.medicine_name}</span></p>
              <p><span className="text-slate-400">Dose & Route:</span> {prescription.dose} • {prescription.route} ({prescription.frequency})</p>
              <p><span className="text-slate-400">Urgency:</span> <span className={`font-bold ${prescription.urgency==='EMERGENCY'?'text-rose-400':'text-amber-400'}`}>{prescription.urgency}</span></p>
            </div>
          </div>

          {/* Screen 5: 8 Checklist Items */}
          <div className="bg-slate-800 border border-slate-700 rounded-xl p-5 space-y-3">
            <h3 className="text-sm font-bold text-slate-200">Clinical & Operational Decision Checklist (8 Protocols)</h3>
            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-3">
              {checklistItems.map((item, idx) => (
                <div key={idx} className="bg-slate-900 border border-slate-700 p-3 rounded-lg flex flex-col justify-between space-y-1">
                  <div className="flex justify-between items-start">
                    <span className="text-xs font-semibold text-slate-200">{item.name}</span>
                    <span className={`text-[10px] font-bold px-2 py-0.5 rounded ${item.status==='PASS'?'bg-emerald-500/20 text-emerald-300':item.status==='FAIL'?'bg-rose-500/20 text-rose-300':'bg-amber-500/20 text-amber-300'}`}>{item.status}</span>
                  </div>
                  <p className="text-[11px] text-slate-400">{item.note}</p>
                </div>
              ))}
            </div>
          </div>

          {/* Screen 6: Candidate Cards */}
          <div className="space-y-3">
            <h3 className="text-sm font-bold text-slate-200">Approved Substitution Candidates ({alternatives.length} Evaluated)</h3>
            <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
              {alternatives.map((alt, idx) => (
                <div key={idx} className={`p-4 rounded-xl border space-y-3 bg-slate-800 ${alt.decision==='RECOMMEND'?'border-emerald-500 bg-emerald-950/10':alt.decision==='BLOCK'?'border-rose-500/40 bg-rose-950/10':alt.decision==='ESCALATE'?'border-amber-500/40 bg-amber-950/10':'border-slate-700'}`}>
                  <div className="flex justify-between items-start">
                    <span className="text-[11px] font-mono text-slate-400">Candidate #{idx+1}</span>
                    <span className={`text-[10px] font-bold px-2 py-0.5 rounded ${alt.decision==='RECOMMEND'?'bg-emerald-500/20 text-emerald-300':alt.decision==='BLOCK'?'bg-rose-500/20 text-rose-300':alt.decision==='ESCALATE'?'bg-amber-500/20 text-amber-300':'bg-slate-700 text-slate-300'}`}>{alt.decision}</span>
                  </div>
                  <div>
                    <h4 className="text-sm font-bold text-slate-100">{alt.alternative}</h4>
                    <p className="text-xs text-slate-300 mt-1">{alt.reasons.join(', ')}</p>
                  </div>
                  <div className="pt-2 border-t border-slate-700 flex justify-between items-center text-xs">
                    <button onClick={()=>onOpenWhy(alt)} className="text-teal-400 font-semibold hover:underline">Why? (Rationale)</button>
                    <span className="text-[10px] font-mono text-slate-400">Risk: <span className="text-teal-300">{alt.risk_level||'LOW'}</span></span>
                  </div>
                </div>
              ))}
            </div>
          </div>

          {/* Action Bar */}
          <div className="bg-slate-800 border border-teal-500/30 rounded-xl p-4 flex justify-between items-center">
            <div>
              <h4 className="text-sm font-bold text-slate-100">Human-in-the-Loop Verification Required</h4>
              <p className="text-xs text-slate-400">Logged in as <span className="text-teal-300 font-semibold">{currentUserRole}</span>.</p>
            </div>
            <button onClick={onOpenReview} className="bg-teal-600 hover:bg-teal-500 text-white px-5 py-2 rounded-lg text-xs font-bold shadow-lg">
              Perform Human Review & Action →
            </button>
          </div>
        </div>
      );
    }

    // Screen 7: Why Modal
    function WhyModal({ alt, requestedMedicine, onClose }) {
      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/70 p-4">
          <div className="bg-slate-900 border border-slate-700 rounded-xl max-w-md w-full p-5 space-y-4 shadow-2xl">
            <div className="flex justify-between items-start border-b border-slate-800 pb-2">
              <h3 className="text-sm font-bold text-slate-100">Decision Rationale & Rules Evidence</h3>
              <button onClick={onClose} className="text-slate-400 font-bold">✕</button>
            </div>
            <div className="space-y-2 text-xs">
              <p><span className="text-slate-400">Candidate:</span> <span className="font-bold text-slate-100">{alt.alternative}</span></p>
              <p><span className="text-slate-400">Requested:</span> {requestedMedicine}</p>
              <p><span className="text-slate-400">Decision State:</span> <span className="font-bold text-teal-300">{alt.decision}</span></p>
              <div className="p-3 bg-slate-950 rounded border border-slate-800 space-y-1">
                <span className="font-bold text-slate-300 block">Triggered Rule Codes:</span>
                <p className="font-mono text-teal-400">{alt.triggered_rules.join(', ')}</p>
                <span className="font-bold text-slate-300 block mt-2">Clinical Evidence:</span>
                <p className="text-slate-200">{alt.reasons.join(', ')}</p>
              </div>
            </div>
            <div className="flex justify-end">
              <button onClick={onClose} className="bg-slate-800 px-4 py-1.5 rounded text-xs font-semibold text-slate-200">Close</button>
            </div>
          </div>
        </div>
      );
    }

    // Screen 8: Review Modal
    function ReviewModal({ evaluation, currentUserRole, onClose, onSuccess }) {
      const [action, setAction] = useState('APPROVE');
      const [overrideReason, setOverrideReason] = useState('');
      const [error, setError] = useState(null);
      const [submitting, setSubmitting] = useState(false);

      const decisionId = evaluation.decision_id || 1;

      const handleSubmit = async () => {
        setError(null);
        setSubmitting(true);

        try {
          if (action === 'APPROVE') {
            await fetch(`${API_BASE}/decisions/${decisionId}/approve?reviewer=${encodeURIComponent(currentUserRole)}`, { method: 'POST' });
          } else if (action === 'REJECT') {
            await fetch(`${API_BASE}/decisions/${decisionId}/reject?reviewer=${encodeURIComponent(currentUserRole)}`, { method: 'POST' });
          } else if (action === 'ESCALATE') {
            await fetch(`${API_BASE}/decisions/${decisionId}/escalate?level=2&reviewer=${encodeURIComponent(currentUserRole)}`, { method: 'POST' });
          } else if (action === 'OVERRIDE') {
            if (!overrideReason.trim()) {
              setError("Override requires documented justification.");
              setSubmitting(false);
              return;
            }
            const res = await fetch(`${API_BASE}/decisions/${decisionId}/override?reviewer=${encodeURIComponent(currentUserRole)}`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ override_reason: overrideReason }),
            });
            if (!res.ok) throw new Error("Override failed");
          }
          onSuccess();
          onClose();
        } catch (e) {
          setError(e.message || "Action failed");
        } finally {
          setSubmitting(false);
        }
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/70 p-4">
          <div className="bg-slate-900 border border-slate-700 rounded-xl max-w-md w-full p-5 space-y-4 shadow-2xl">
            <div className="flex justify-between border-b border-slate-800 pb-2">
              <h3 className="text-sm font-bold text-slate-100">Human-in-the-Loop Verification</h3>
              <button onClick={onClose} className="text-slate-400 font-bold">✕</button>
            </div>

            {error && <div className="p-2 bg-rose-950 border border-rose-500/50 text-rose-300 text-xs rounded">{error}</div>}

            <div className="grid grid-cols-2 gap-2 text-xs font-bold">
              <button onClick={()=>setAction('APPROVE')} className={`p-2.5 rounded border ${action==='APPROVE'?'bg-emerald-600/30 border-emerald-500 text-emerald-200':'bg-slate-800 text-slate-300'}`}>Approve</button>
              <button onClick={()=>setAction('REJECT')} className={`p-2.5 rounded border ${action==='REJECT'?'bg-rose-600/30 border-rose-500 text-rose-200':'bg-slate-800 text-slate-300'}`}>Reject</button>
              <button onClick={()=>setAction('ESCALATE')} className={`p-2.5 rounded border ${action==='ESCALATE'?'bg-amber-600/30 border-amber-500 text-amber-200':'bg-slate-800 text-slate-300'}`}>Escalate</button>
              <button onClick={()=>setAction('OVERRIDE')} className={`p-2.5 rounded border ${action==='OVERRIDE'?'bg-purple-600/30 border-purple-500 text-purple-200':'bg-slate-800 text-slate-300'}`}>Override Block</button>
            </div>

            {action === 'OVERRIDE' && (
              <div className="space-y-1 text-xs">
                <label className="font-bold text-purple-300 block">Mandatory Override Justification *</label>
                <textarea
                  value={overrideReason}
                  onChange={e=>setOverrideReason(e.target.value)}
                  placeholder="Enter detailed clinical rationale for overriding system block..."
                  rows={3}
                  className="w-full bg-slate-950 border border-purple-500/40 rounded p-2 text-slate-200 focus:outline-none"
                />
              </div>
            )}

            <div className="flex justify-end gap-2 pt-2">
              <button onClick={onClose} className="px-3 py-1.5 bg-slate-800 text-xs rounded text-slate-300">Cancel</button>
              <button onClick={handleSubmit} disabled={submitting} className="px-4 py-1.5 bg-teal-600 text-xs rounded font-bold text-white">
                {submitting ? 'Recording...' : 'Submit Action'}
              </button>
            </div>
          </div>
        </div>
      );
    }

    // Screen 9: Escalations View
    function EscalationsView({ escalations, onSelectPrescription }) {
      return (
        <div className="space-y-4">
          <h2 className="text-lg font-bold text-slate-100">Clinical Escalation Center</h2>
          <div className="bg-slate-800 border border-slate-700 rounded-xl overflow-hidden shadow-xl">
            <table className="w-full text-left text-xs text-slate-300">
              <thead className="bg-slate-900 text-slate-400 uppercase font-semibold border-b border-slate-700">
                <tr>
                  <th className="p-3">Prescription</th>
                  <th className="p-3">Urgency</th>
                  <th className="p-3">Escalation Level</th>
                  <th className="p-3">Reason</th>
                  <th className="p-3 text-right">Action</th>
                </tr>
              </thead>
              <tbody className="divide-y divide-slate-700">
                {escalations.map(c => (
                  <tr key={c.decision_id} className="hover:bg-slate-700/50">
                    <td className="p-3 font-mono font-bold text-slate-200">{c.prescription_code}</td>
                    <td className="p-3"><span className="px-2 py-0.5 rounded text-[10px] bg-rose-500/20 text-rose-300 font-bold">{c.urgency}</span></td>
                    <td className="p-3 font-bold text-amber-300">Level {c.escalation_level} Escalation</td>
                    <td className="p-3 text-slate-300">{c.reasons || 'Prescriber approval required'}</td>
                    <td className="p-3 text-right">
                      <button onClick={()=>onSelectPrescription(c.prescription_id)} className="bg-teal-600/20 text-teal-300 border border-teal-500/40 px-3 py-1 rounded font-semibold text-xs">
                        Review →
                      </button>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    // Screen 10: Audit View
    function AuditView({ logs }) {
      return (
        <div className="space-y-4">
          <h2 className="text-lg font-bold text-slate-100">Immutable Audit Log History</h2>
          <div className="bg-slate-800 border border-slate-700 rounded-xl overflow-hidden shadow-xl">
            <table className="w-full text-left text-xs text-slate-300">
              <thead className="bg-slate-900 text-slate-400 uppercase font-semibold border-b border-slate-700">
                <tr>
                  <th className="p-3">Timestamp</th>
                  <th className="p-3">Decision ID</th>
                  <th className="p-3">Action</th>
                  <th className="p-3">User</th>
                  <th className="p-3">Reason</th>
                </tr>
              </thead>
              <tbody className="divide-y divide-slate-700 font-mono">
                {logs.map(l => (
                  <tr key={l.id} className="hover:bg-slate-700/50">
                    <td className="p-3 text-slate-400 text-[11px]">{new Date(l.timestamp).toLocaleString()}</td>
                    <td className="p-3 font-bold text-teal-300">DEC-{l.decision_id}</td>
                    <td className="p-3 font-sans font-bold"><span className="px-2 py-0.5 bg-teal-500/20 text-teal-300 rounded">{l.action}</span></td>
                    <td className="p-3 font-sans text-slate-200">{l.performed_by}</td>
                    <td className="p-3 font-sans text-slate-300">{l.reason || 'N/A'}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    // Screen 11: Validation View
    function ValidationView({ data }) {
      if (!data) return null;
      const { proposed_system, baseline_comparison } = data;

      return (
        <div className="space-y-6">
          <div className="bg-slate-800 p-4 rounded-xl border border-slate-700 flex justify-between items-center">
            <div>
              <h2 className="text-lg font-bold text-slate-100">Validation, Baseline & Experiment Dashboard</h2>
              <p className="text-xs text-slate-400">Empirical benchmark calculated from synthetic dataset execution traces.</p>
            </div>
            <span className="font-mono text-xs text-teal-300 bg-slate-900 border border-slate-700 px-3 py-1 rounded">Seed: 42</span>
          </div>

          <div className="bg-emerald-950/30 border border-emerald-500/40 p-4 rounded-xl flex justify-between items-center">
            <div>
              <h3 className="text-base font-bold text-emerald-300">Unsafe False Negative Rate: 0.0%</h3>
              <p className="text-xs text-slate-300">Zero unsafe substitutions were incorrectly approved. All clinical conflicts were 100% blocked.</p>
            </div>
            <div className="text-right font-mono">
              <span className="text-xs text-slate-400 block">Audit Completion Rate</span>
              <span className="text-lg font-bold text-emerald-400">100.0%</span>
            </div>
          </div>

          <div className="bg-slate-800 border border-slate-700 rounded-xl p-5 space-y-3">
            <h3 className="text-sm font-bold text-slate-200">Baseline Simulation vs. Proposed System Benchmark</h3>
            <table className="w-full text-left text-xs text-slate-300">
              <thead className="bg-slate-900 text-slate-400 uppercase border-b border-slate-700">
                <tr>
                  <th className="p-3">Performance Metric</th>
                  <th className="p-3">Manual Baseline</th>
                  <th className="p-3">Target Objective</th>
                  <th className="p-3">Proposed System (Measured)</th>
                  <th className="p-3 text-right">Status</th>
                </tr>
              </thead>
              <tbody className="divide-y divide-slate-700">
                {baseline_comparison.metrics.map((m, idx) => (
                  <tr key={idx}>
                    <td className="p-3 font-semibold text-slate-200">{m.metric}</td>
                    <td className="p-3 text-rose-300 font-mono">{m.baseline}</td>
                    <td className="p-3 text-slate-400 font-mono">{m.target}</td>
                    <td className="p-3 font-bold text-emerald-400 font-mono">{m.proposed_system}</td>
                    <td className="p-3 text-right"><span className="px-2 py-0.5 bg-emerald-500/20 text-emerald-300 rounded font-bold">{m.status}</span></td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
